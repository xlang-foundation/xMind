name: Native Windows contracts
on:
  push:
    branches: [main, 'checkpoint/**']
    paths: ['CMakeLists.txt', 'Native/**', 'Tools/**', 'doc/runtime-prerequisites/**', 'extensions/vscode/**', 'views/browser/**', '.github/workflows/native-windows.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'Native/**', 'Tools/**', 'doc/runtime-prerequisites/**', 'extensions/vscode/**', 'views/browser/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: windows-2025
    # Clean SDK/native builds take about 48 minutes on this runner; leave time
    # for the complete serial contract set and diagnostic publication. Individual
    # CTest and product process deadlines remain unchanged.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out xMind
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: xmind
          persist-credentials: false
      - name: Check out pinned xlang3 runtime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: CantorAI/xlang3
          ref: 6df6520f3728678341de3db18c95ff6499103f1a
          path: xlang3
          persist-credentials: false
      - name: Check out allowed standard-library source only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: python/cpython
          ref: ebf955df7a89ed0c7968f79faec1de49f61ed7cb # v3.14.0
          path: stdlib-source
          sparse-checkout: |
            Lib
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build native xlang3 and xMind; run complete contract set
        run: ./xmind/Tools/ci-native.ps1 -RuntimeSource ./xlang3 -StdlibSource ./stdlib-source/Lib
      # Run after native completion (including failure) so these PowerShell
      # fixtures cannot warm the shell before the native startup contracts.
      - name: Verify owned process diagnostics isolation
        if: always()
        working-directory: xmind
        run: |
          New-Item -ItemType Directory -Force -Path build/ci-evidence | Out-Null
          node --test Tools/tests/owned-process-diagnostics.test.mjs Tools/tests/instruction-fixture-retention.test.mjs > build/ci-evidence/owned-process-diagnostics-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test Tools/tests/native-fixture-timing.test.mjs > build/ci-evidence/native-fixture-timing-contract.log
          exit $LASTEXITCODE
      - name: Run extension contracts without package lifecycle scripts
        working-directory: xmind/extensions/vscode
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Verify browser view and native runtime separation
        working-directory: xmind
        run: |
          node views/browser/build.mjs build/browser-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XMIND_BROWSER_TEST_ASSETS='build/browser-assets'
          node --test views/browser/tests/*.cjs > build/ci-evidence/browser-controller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node views/browser/tests/native-contract.mjs build/native/Release/xmind.exe ../xlang3/build/Release/modules ../stdlib-source/Lib build/browser-assets > build/ci-evidence/browser-native.log
          exit $LASTEXITCODE
      - name: Stage the contract-tested native runtime and pinned pure library source
        working-directory: xmind
        run: |
          node --test Tools/tests/ci-runtime-pins.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Tools/ci-stage-runtime.mjs
          exit $LASTEXITCODE
      # Bootstrap executes from the staged package, with an offline installation
      # from the pinned source wheel rather than a runner's Python installation.
      - name: Verify packaged xlang3 pip bootstrap and offline installation
        working-directory: xmind
        run: node Tools/verify-packaged-pip.mjs extensions/vscode/native-runtime ../stdlib-source/Lib/ensurepip/_bundled build/ci-evidence
      - name: Package and verify shared browser assets
        working-directory: xmind/extensions/vscode
        run: |
          npm run package -- --out ../../build/ci-evidence/xmind.vsix > ../../build/ci-evidence/browser-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../../Tools/verify-browser-vsix.ps1 -Path ../../build/ci-evidence/xmind.vsix > ../../build/ci-evidence/browser-package-verification.log
      # A minidump without its exact PE images cannot reliably unwind native
      # worker frames. Keep these build outputs separately on failure; optional
      # PDBs are included when produced. No credentials/configuration are here.
      - name: Preserve matching native images for failed-worker dump analysis
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-windows-diagnostic-images-${{ github.sha }}
          path: |
            xmind/build/native/Release/xmind.exe
            xmind/build/native/Release/xmind.pdb
            xmind/build/native/Release/agentflow_agent_worker_model_rpc_contract.exe
            xmind/build/native/Release/agentflow_agent_worker_model_rpc_contract.pdb
            xmind/build/native/Release/agentflow_agent_worker_ledger_contract.exe
            xmind/build/native/Release/agentflow_agent_worker_ledger_contract.pdb
            xlang3/build/Release/xlang3_runtime.dll
            xlang3/build/Release/xlang3_runtime.pdb
            xlang3/build/Release/modules/**/*.dll
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve build and test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-windows-evidence-${{ github.sha }}
          path: |
            xmind/build/ci-evidence/
            xmind/build/native/Testing/
            xmind/build/skill-state-native/instruction-failures/
          # Controlled fixtures may retain their policy/database in .config or
          # .agentflow. These isolated tests use synthetic credentials only.
          include-hidden-files: true
          retention-days: 14
      - name: Preserve contract-tested native development bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-windows-runtime-${{ github.sha }}
          path: xmind/build/native-distribution/
          if-no-files-found: error
          retention-days: 14
