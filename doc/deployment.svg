<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1060" viewBox="0 0 1560 1060" role="img" aria-labelledby="title desc">
<title id="title">xMind Server — local and team deployment</title>
<desc id="desc">The same native C++ server runs locally or centrally for teams. xlang3 performs SQLite or PostgreSQL operations. Authenticated workers execute workspace actions, while the server owns shared state and model credentials.</desc>
<defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#17293f} .title{font-size:32px;font-weight:700}.heading{font-size:23px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px;fill:#405771}.small{font-size:15px;fill:#52667e}.panel{fill:white;stroke:#c7d3e2;stroke-width:1.5}.native{fill:#eef4ff;stroke:#6787bd;stroke-width:1.5}.runtime{fill:#eaf8f0;stroke:#589875;stroke-width:1.5}.flow{fill:none;stroke:#476a9e;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#476a9e"/></marker>
</defs>
<rect width="1560" height="1060" fill="#f6f8fc"/>
<text x="42" y="54" class="title">xMind Server — one platform, two deployment modes</text>
<text x="42" y="87" class="body">Proposed team architecture · C++ core · SQLite / PostgreSQL through xlang3 · shared CLI / IDE API</text>

<rect x="42" y="121" width="465" height="801" rx="18" class="panel"/>
<text x="66" y="163" class="heading">Local developer</text>
<text x="66" y="191" class="body">One machine • local service and workspace</text>
<rect x="67" y="218" width="415" height="76" rx="12" class="native"/>
<text x="274" y="263" text-anchor="middle" class="label">VS Code / CLI / future IDE</text>
<path d="M274 295V332" class="flow"/>
<rect x="67" y="335" width="415" height="172" rx="12" class="native"/>
<text x="89" y="372" class="heading">Local xMind Server</text>
<text x="89" y="407" class="body">Agents / graphs · coding engine</text>
<text x="89" y="439" class="body">Models · MCP / A2A · permissions</text>
<text x="89" y="475" class="small">Same core and API as team deployment</text>
<path d="M274 508V544" class="flow"/>
<rect x="67" y="547" width="415" height="109" rx="12" class="runtime"/>
<text x="89" y="586" class="label">Embedded xlang3 → SQLite</text>
<text x="89" y="620" class="body">Local state, configuration, encrypted secrets</text>
<path d="M274 657V693" class="flow"/>
<rect x="67" y="696" width="415" height="133" rx="12" class="native"/>
<text x="89" y="735" class="label">Local workspace worker</text>
<text x="89" y="769" class="body">Files · shell / PTY · Git · diagnostics</text>
<text x="89" y="801" class="small">Can be colocated with the local server</text>
<text x="67" y="880" class="small">Loopback connection; durable local sessions.</text>

<rect x="537" y="121" width="981" height="801" rx="18" class="panel"/>
<text x="563" y="163" class="heading">Company / team</text>
<text x="563" y="191" class="body">Shared service • authenticated users • isolated workspace execution</text>
<rect x="563" y="218" width="929" height="76" rx="12" class="native"/>
<text x="1027" y="263" text-anchor="middle" class="label">Developer A client      ·      Developer B client      ·      Team web / IDE client</text>
<path d="M1027 295V332" class="flow"/>
<text x="1045" y="319" class="small">Authenticated HTTPS / event stream</text>
<rect x="563" y="335" width="929" height="172" rx="12" class="native"/>
<text x="586" y="372" class="heading">Shared xMind Server</text>
<text x="586" y="407" class="body">Same C++ engine · organizations / projects / memberships · session sharing · role-based access</text>
<text x="586" y="439" class="body">Model credentials and routing · graph scheduler · approvals · audit · MCP / A2A connectors</text>
<text x="586" y="475" class="small">Server owns durable jobs and events; disconnecting a client does not lose execution state.</text>
<path d="M1027 508V544" class="flow"/>
<rect x="563" y="547" width="929" height="109" rx="12" class="runtime"/>
<text x="586" y="586" class="label">Embedded xlang3 → SQLite / PostgreSQL</text>
<text x="586" y="620" class="body">Shared information + encrypted credential blobs · accessed through server APIs</text>
<path d="M760 657V680H708V693" class="flow"/>
<path d="M1027 657V693" class="flow"/>
<path d="M1294 657V680H1339V693" class="flow"/>
<rect x="563" y="696" width="290" height="133" rx="12" class="native"/>
<text x="584" y="733" class="label">Developer A worker</text>
<text x="584" y="768" class="body">A's permitted workspace</text>
<text x="584" y="800" class="small">C++ tools + xlang3 scripts</text>
<rect x="883" y="696" width="290" height="133" rx="12" class="native"/>
<text x="904" y="733" class="label">Developer B worker</text>
<text x="904" y="768" class="body">B's permitted workspace</text>
<text x="904" y="800" class="small">C++ tools + xlang3 scripts</text>
<rect x="1203" y="696" width="289" height="133" rx="12" class="native"/>
<text x="1224" y="733" class="label">Server / build worker</text>
<text x="1224" y="768" class="body">Isolated repo / worktree</text>
<text x="1224" y="800" class="small">Run-specific workspace</text>
<text x="563" y="870" class="small">Workers authenticate and receive scoped jobs; server and worker permissions both apply.</text>
<text x="563" y="898" class="small">Clients and workers do not open a shared database file or receive model API secrets.</text>

<rect x="42" y="947" width="1476" height="78" rx="13" fill="#e8eef8"/>
<text x="64" y="978" class="label">Storage and execution are separate</text>
<text x="64" y="1006" class="body">Select SQLite or PostgreSQL. Teams connect by API; workspace workers run locally or on company infrastructure.</text>
</svg>
